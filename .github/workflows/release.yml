name: Build APK & Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_KEYSTORE_ALIAS" ]; then
            echo "::error::Missing RELEASE_KEYSTORE / RELEASE_KEYSTORE_ALIAS secrets"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_KEYSTORE_PASSWORD" \
            "$RELEASE_KEYSTORE_ALIAS" \
            "$RELEASE_KEYSTORE_KEY_PASSWORD" \
            > android/keystore.properties

      - name: Build APKs
        run: ./gradlew :app:assembleRelease
        working-directory: android

      - name: Sign APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KEYSTORE="$PWD/android/app/release.keystore"
          OUT="$PWD/android/app/build/outputs/apk/release"
          for APK in "$OUT"/*.apk; do
            if ! "$BUILD_TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$KEYSTORE" \
                --ks-key-alias "$RELEASE_KEYSTORE_ALIAS" \
                --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
                --key-pass "pass:$RELEASE_KEYSTORE_KEY_PASSWORD" \
                "$APK"
            fi
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -2
            SIGNED="${APK/-unsigned/}"
            [ "$APK" != "$SIGNED" ] && mv "$APK" "$SIGNED"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coupleplay-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
